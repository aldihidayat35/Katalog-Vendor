<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1a17" />
      <stop offset="45%" stop-color="#2a221c" />
      <stop offset="100%" stop-color="#14110f" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6c8" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#e8c872" />
    </linearGradient>

    <!-- Bronze Glow Gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Pattern -->
    <pattern id="luxDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#d4af37" fill-opacity="0.15" />
    </pattern>

    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="32" fill="url(#bgGrad)" />
  <rect width="600" height="800" rx="32" fill="url(#glowGrad)" />
  <rect width="600" height="800" rx="32" fill="url(#luxDots)" />

  <!-- Outer Luxury Border -->
  <rect x="24" y="24" width="552" height="752" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  <rect x="32" y="32" width="536" height="736" rx="18" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="6,4" />

  <!-- Corner Floral Accents -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.7">
    <!-- Top Left -->
    <path d="M 40 60 C 40 46, 46 40, 60 40 M 40 75 C 40 55, 55 40, 75 40" />
    <!-- Top Right -->
    <path d="M 560 60 C 560 46, 554 40, 540 40 M 560 75 C 560 55, 545 40, 525 40" />
    <!-- Bottom Left -->
    <path d="M 40 740 C 40 754, 46 760, 60 760 M 40 725 C 40 745, 55 760, 75 760" />
    <!-- Bottom Right -->
    <path d="M 560 740 C 560 754, 554 760, 540 760 M 560 725 C 560 745, 545 760, 525 760" />
  </g>

  <!-- Header Badge: LIMITED OFFER -->
  <g transform="translate(300, 95)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#38291d" stroke="url(#goldGrad)" stroke-width="1.2" />
    <text x="0" y="5" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#f5e6c8" text-anchor="middle">
      LIMITED TIME OFFER
    </text>
  </g>

  <!-- Brand Name -->
  <text x="300" y="165" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="#a89a8a" text-anchor="middle">
    GALERIA INVITATION
  </text>

  <!-- Main Headline -->
  <text x="300" y="225" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" filter="url(#shadowGlow)">
    Promo Spesial
  </text>
  <text x="300" y="275" font-family="'Playfair Display', Georgia, serif" font-size="34" font-style="italic" font-weight="500" fill="#ffffff" text-anchor="middle">
    Pernikahan Impian
  </text>

  <!-- Divider Ribbon -->
  <g transform="translate(300, 310)">
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#d4af37" />
    <line x1="20" y1="0" x2="120" y2="0" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Discount Badge Hero Circle -->
  <g transform="translate(300, 425)">
    <!-- Outer Glow Rings -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="86" fill="#251e19" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-opacity="0.4" />
    
    <text x="0" y="-35" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#d4af37" text-anchor="middle">
      DISKON HINGGA
    </text>
    <text x="0" y="22" font-family="'Playfair Display', Georgia, serif" font-size="58" font-weight="700" fill="#ffffff" text-anchor="middle">
      30%
    </text>
    <text x="0" y="52" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#e8c872" text-anchor="middle">
      SEMUA PAKET CETAK
    </text>
  </g>

  <!-- Feature List -->
  <g transform="translate(300, 565)" text-anchor="middle" font-family="'DM Sans', sans-serif" fill="#dcd6cf" font-size="13">
    <text x="0" y="0">✦ Gratis Desain Draf &amp; Revisi Tanpa Batas</text>
    <text x="0" y="26">✦ Bonus Video Undangan Digital Premium</text>
    <text x="0" y="52">✦ Kunci Antrian Cukup DP 50%</text>
  </g>

  <!-- CTA Button Container -->
  <g transform="translate(300, 680)">
    <rect x="-170" y="-26" width="340" height="52" rx="26" fill="url(#goldGrad)" filter="url(#shadowGlow)" />
    <text x="0" y="7" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#1b1613" text-anchor="middle">
      KLAIM PROMO SEKARANG &#8594;
    </text>
  </g>

  <text x="300" y="745" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#887c71" text-anchor="middle">
    *Berlaku untuk 20 pemesan pertama bulan ini. Klik poster untuk detail.
  </text>
</svg>
