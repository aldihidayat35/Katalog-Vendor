<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C241E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3A312A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E1914;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B8956A;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#B8956A;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#bannerGrad)" />
  <circle cx="800" cy="300" r="450" fill="url(#goldGlow)" />
  <rect x="50" y="50" width="1500" height="500" fill="none" stroke="#B8956A" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.4" rx="12" />
  <g transform="translate(800, 270)" text-anchor="middle">
    <text y="0" font-family="'Playfair Display', serif, Georgia" font-size="44" font-weight="600" fill="#FAF7F2" letter-spacing="2">Momen Bahagia, Dimulai dari Sini</text>
    <text y="50" font-family="'Inter', sans-serif" font-size="18" fill="#D4AF37" letter-spacing="4">EKSKLUSIF • ELEGAN • PREMIUM</text>
    <text y="90" font-family="'Inter', sans-serif" font-size="16" fill="#A89B8F">Koleksi Desain Undangan Cetak &amp; Digital Terlengkap</text>
  </g>
</svg>
